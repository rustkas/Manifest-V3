<html lang="en">
<head>

  <meta
    name="viewport"

  <title>Page Info</title>

    body {

      font-family: system-ui, sans-serif;
    }

    h1 {

      margin-top: 0;
    }

    }

    }

  </p>

  <script src="popup.js"></script>
