<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Notes</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Page Notes</h1>
      <p id="page-title" class="page-title" title="">Loading…</p>
      <p id="page-url" class="page-url" title=""></p>
    </header>

    <main>
      <label for="note" class="label">Your note for this page</label>
      <textarea
        id="note"
        rows="8"
        placeholder="Write a private note for this page…"
        spellcheck="true"
      ></textarea>

      <div class="status" id="status" aria-live="polite"></div>

      <div class="actions">
        <button id="save-btn" class="btn primary">Save note</button>
        <button id="clear-btn" class="btn secondary">Clear</button>
      </div>

      <div class="optional-section">
        <button id="bookmark-btn" class="btn outline" disabled>
          Save to bookmarks
        </button>
        <p id="bookmark-hint" class="hint">
          Requires optional “bookmarks” permission
        </p>
      </div>
    </main>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
